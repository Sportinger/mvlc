[workspace]
members = [
    "crates/app",
    "crates/mvlc-core",
    "crates/media",
    "crates/render",
    "crates/project",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MVLC Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/mvlc"
description = "Modern Video Layered Compositor"

[workspace.dependencies]
# Core dependencies shared across crates
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
tokio = { version = "1.0", features = ["full"] }

# UI
winit = "0.29"
egui = "0.26"
egui-winit = "0.26"
egui-wgpu = "0.26"

# Media
gstreamer = "0.21"
gstreamer-video = "0.21"
gstreamer-app = "0.21"

# Audio
cpal = "0.15"

# Rendering
ash = "0.37"  # Vulkan bindings
vk-mem = "0.3"  # Vulkan memory allocator
ash-window = "0.13"  # Vulkan windowing

# Build dependencies
bindgen = "0.69"

# Local crates
mvlc-core = { path = "crates/mvlc-core" }
mvlc-media = { path = "crates/media" }
mvlc-render = { path = "crates/render" }
mvlc-project = { path = "crates/project" }
